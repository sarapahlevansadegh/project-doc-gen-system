services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: docgen
      POSTGRES_USER: docgen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docgen_pass_123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - docgen


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:

      # PyTorch CPU threading: a known class of "Illegal instruction (core
      # dumped)" crashes happens when PyTorch's multi-threaded BLAS/oneDNN
      # kernels pick a code path the host CPU doesn't actually support
      # (seen here: crashed processing a slightly-over-512-token chunk
      # during bge-base-en-v1.5 embedding, but not on shorter ones -
      # consistent with a threaded-kernel-selection issue rather than a
      # blanket incompatibility). Pinning to a single thread is the
      # standard mitigation for this failure signature in containerized
      # CPU inference.
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false

      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://docgen:docgen_pass_123@db:5432/docgen}
      - DB_PASSWORD=${DB_PASSWORD:-docgen_pass_123}


      # LLM Provider Selection
      - DOCGEN_LLM_PROVIDER=${DOCGEN_LLM_PROVIDER:-gemini}


      # Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DOCGEN_LLM_MODEL=${DOCGEN_LLM_MODEL:-gemini-2.5-flash}


      # Other Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}


      - DOCGEN_ANTHROPIC_MODEL=${DOCGEN_ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}

      - DOCGEN_GROQ_MODEL=${DOCGEN_GROQ_MODEL:-llama-3.3-70b-versatile}

      - DOCGEN_OPENAI_MODEL=${DOCGEN_OPENAI_MODEL:-gpt-4o-mini}

      - DOCGEN_OPENROUTER_MODEL=${DOCGEN_OPENROUTER_MODEL:-google/gemini-2.5-pro}


      # Ollama Local Models
      - DOCGEN_OLLAMA_MODEL=${DOCGEN_OLLAMA_MODEL:-qwen3:4b}
      - DOCGEN_OLLAMA_URL=${DOCGEN_OLLAMA_URL:-http://host.docker.internal:11434}


      # RAG
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface


      # Security
      - SECRET_KEY=${SECRET_KEY:-}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}


      # Generated Files
      - GENERATED_DOCS_PATH=/app/generated_docs


    ports:
      - "8000:8000"


    volumes:
      - ./generated_docs:/app/generated_docs
      - ./reference_templates:/app/reference_templates
      - ./device_documents:/app/device_documents
      - huggingface_cache:/root/.cache/huggingface
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock


    depends_on:
      db:
        condition: service_healthy


    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


    restart: unless-stopped


    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M


    networks:
      - docgen


    command: >
      sh -c "alembic upgrade head &&
      python -m uvicorn app:app --host 0.0.0.0 --port 8000"



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - docgen



volumes:
  postgres_data:
  huggingface_cache:


networks:
  docgen:
