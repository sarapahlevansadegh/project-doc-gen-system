server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Upload size cap; keep in sync with backend max_device_document_upload_bytes
    client_max_body_size 55m;

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document upload + embedding (bge-base-en-v1.5, CPU) can run well
        # past nginx's 60s default for larger reference/device documents -
        # the request would otherwise 504 to the client while the backend
        # keeps processing to completion regardless, leaving an orphaned-
        # looking row that only shows up after the fact.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
