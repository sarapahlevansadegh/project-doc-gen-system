[project]
name = "doc-gen-system"
version = "0.1.0"
description = "AI document generation system"
readme = "README.md"
requires-python = ">=3.11.9,<3.12"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.138.0",

    "openai>=1.0.0",
    "groq>=1.5.0",
    "httpx>=0.28.1",

    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",

    # CPU embedding stack
    "sentence-transformers>=3.0.1",
    "torch==2.7.1",

    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5",

    "pgvector>=0.3.0,<0.5.0",

    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",

    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",

    "cairosvg",

    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "scalar-fastapi>=0.1.0",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
index-strategy = "unsafe-best-match"


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "SIM",
    "ARG",
    "PTH",
    "PD",
    "PL",
    "RUF"
]

ignore = [
    "E501",
    "B904",
    "SIM115",
    "PLR2004",
    "PLR0913",
    "PLR0917",
    "PLR0915",
    "PLR0912",
    "PLR0911",
    "ARG001",
    "B008",
    "F401",
    "N802",
    "N803",
    "PLW0603",
    "N806",
    "PTH123",
    "ARG002",
    "ARG005",
    "B023",
    "RUF012",
    "SIM117",
    "SIM105",
    "PLR1714",
    "PLW2901",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true


[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
follow_imports = "silent"

exclude = [
    "backend/db/migrations/versions/",
    "backend/tests/",
    ".venv/",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
